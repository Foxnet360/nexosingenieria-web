target:
  base_url: "https://nexosingenieria.com"
  domain: "nexosingenieria.com"
  
scraping:
  max_depth: 3
  rate_limit_delay: 1.0
  max_retries: 3
  timeout: 30
  user_agent: "NexosScraper/1.0 (Data Migration Project)"
  
paths:
  raw_pages: "data/scraped/raw/pages"
  raw_assets: "data/scraped/raw/assets"
  processed_content: "data/scraped/processed/content"
  processed_images: "data/scraped/processed/images"
  processed_metadata: "data/scraped/processed/metadata"
  exports_json: "data/scraped/exports/json"
  exports_csv: "data/scraped/exports/csv"
  exports_markdown: "data/scraped/exports/markdown"

classification:
  categories:
    - services
    - projects
    - partners
    - blog
    - corporate
  service_types:
    - security
    - cabling
    - automation
  partner_keywords:
    - "Hikvision"
    - "Dahua"
    - "Panduit"
    - "CommScope"
    - "Siemon"
    - "Furukawa"
    - "Legrand"
    - "Control4"
    - "Crestron"
    - "KNX"
    - "Axis"

export:
  formats:
    - json
    - csv
    - markdown
